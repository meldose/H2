session_name: h2_state_viewer_real
start_directory: ..

# ============================================================================
# h2_state_viewer_real - tmux Session
# Usage:       tmuxp load tmux/h2_state_viewer_real.tmuxp.yaml
# Attach:      tmux attach -t h2_state_viewer_real
# Detach:      Ctrl+B, then D
# Stop:        tmux kill-session -t h2_state_viewer_real
# ============================================================================
#
# view_h2_real_state.py against the real robot: domain_id 0 (the real
# robot's default — see unitree_mujoco/readme.md's own config.yaml comment),
# interface from tmux/h2_interface.env so it isn't retyped on the command
# line each time. Read-only: only subscribes rt/lowstate, never publishes
# rt/lowcmd, so it's safe to point at the robot's live DDS domain — see
# docs/RUNBOOK.md § Real robot for the one-time host IP/interface setup.
#
# No sim counterpart — running view_h2_real_state.py --mock next to the sim's
# own MuJoCo window just opened a second, near-identical MuJoCo window
# (mirrored DDS state vs. the sim's actual physics), removed as redundant.
# For a live sim view instead, use tmux/h2_rviz_live_sim.tmuxp.yaml (RViz,
# not MuJoCo, but the same read-only rt/lowstate approach).

options:
  mouse: 'on'
  history-limit: 10000

windows:
  - window_name: state
    panes:
      - shell_command:
          - ./docker/run_container.sh
          - >-
            set -a; source tmux/h2_interface.env; set +a;
            python3 scripts/view_h2_real_state.py --interface "$H2_INTERFACE"
