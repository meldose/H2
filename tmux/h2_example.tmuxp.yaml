session_name: h2_example
start_directory: ..

# ============================================================================
# h2_example - tmux Session
# Usage:       tmuxp load tmux/h2_example.tmuxp.yaml
# Attach:      tmux attach -t h2_example
# Detach:      Ctrl+B, then D
# Switch pane: Ctrl+B, then arrow key / mouse click
# Zoom pane:   Ctrl+B, then Z (again = back)
# Scroll:      mouse wheel
# Stop:        tmux kill-session -t h2_example
# ============================================================================
#
# The getting-started demo: sim + the h2_ankle_swing_example controller +
# a free monitor shell. For a plain sim with a raw DDS state printout
# instead, see h2_dds_test.tmuxp.yaml, or h2_rviz_live_sim.tmuxp.yaml for
# an RViz view.

# Mouse support (scrolling, pane selection, resize)
options:
  mouse: 'on'
  history-limit: 10000

# Three windows: simulator, a control shell, and a monitoring shell.
# The control/monitor windows wait for the container to actually be up
# before attaching, since `docker exec` fails until it exists.
windows:
  - window_name: simulator
    panes:
      - shell_command:
          - ./docker/run_container.sh
          - ./scripts/run_unitree_mujoco.sh

  - window_name: control
    panes:
      - shell_command:
          - until docker exec h2_ws_container true 2>/dev/null; do sleep 1; done
          - docker exec -it h2_ws_container bash /home/robost/h2_ws/tmux/control_entrypoint.sh

  - window_name: monitor
    panes:
      - shell_command:
          - until docker exec h2_ws_container true 2>/dev/null; do sleep 1; done
          - >-
            docker exec -it h2_ws_container bash -c
            "source ~/unitree_ros2/setup_local.sh; export ROS_DOMAIN_ID=1; exec bash"
